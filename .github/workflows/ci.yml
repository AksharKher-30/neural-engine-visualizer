name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install coremltools numpy Pillow matplotlib opencv-python pyzmq pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        # Tests that need .mlpackage, engine binary, or webcam auto-skip via pytest.skip()